
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1">
  <title>IDLI COFFEE BAR</title>

  <style>
    body {
      margin: 0;
      background: #F8F2E6;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #173D31;
    }
    header {
      background: #103C30;
      color: #E9C77A;
      padding: 30px 15px;
    }
    h1 { font-size: 34px; }
    
.menu {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  padding: 30px 16px;
}

.menu h2 {
  grid-column: 1 / -1;
  margin: 10px 0 18px;
}


.item {
  background: white;
  border-radius: 12px;
  padding: 22px 8px;
  margin: 0;
  box-shadow: 0 2px 8px #ddd;
}
    footer {
      background: #103C30;
      color: white;
      padding: 20px;
    }
  </style>
</head>

<body>
  <header>
  <img
  src="icb-logo-clean.jpg"
  alt="IDLI COFFEE BAR Logo"
  style="width:220px; max-width:85%; height:auto; margin-bottom:20px;"
>
    <h1>IDLI COFFEE BAR</h1>
    <h3>BY NAVAGUNJARA</h3>
    <p>Authentic South Indian Flavours</p>
  </header>

  <section class="menu">
    <h2>OUR MENU</h2>
    <div class="item">Soft Idli</div>
    <div class="item">Mini Vada Balls</div>
    <div class="item">Khara Bath</div>
    <div class="item">Kesari Bath</div>
    <div class="item">Mushroom Biryani</div>
    <div class="item">Filter Coffee</div>
    <div class="item">Tea</div>
  </section>

  <footer>
    <p>IDLI COFFEE BAR</p>
    <p>By NAVAGUNJARA</p>
    <small>Demonstration website</small>
  </footer>
</body>
</html>
